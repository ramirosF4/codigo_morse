<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor de Código Morse</title>
</head>
<body class="bg-light">
    <header class="bg-primary text-white py-4 shadow">
        <div class="container text-center">
            <h1 class="fw-bold">
                Transpilador de Código Morse
            </h1>
        </div>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow">
                    <div class="card-header bg-white text-center py-3">
                        <h2 class="h5 mb-0">
                            <i class="fas fa-exchange-alt text-primary me-2"></i>
                            Selecciona el tipo de conversión
                        </h2>
                    </div>
                    <div class="card-body p-4">
                        <div class="d-grid gap-2 d-md-flex mb-4">
                            <button id="textoAMorse" type="button" class="btn btn-primary flex-fill active">
                                Texto a Morse
                            </button>

                            <button id="morseATexto" type="button" class="btn btn-outline-primary flex-fill">
                                <i class="fas fa-braille me-2"></i>
                                Morse a texto
                            </button>
                        </div>
                        <div class="mb-4">
                            <label for="entrada" id="etiquetaEntrada" class="form-label fw-bold">
                                <i class="fas fa-keyboard me-2"></i>
                                Escribe el texto que deseas convertir:
                            </label>
                            <textarea id="entrada" class="form-control" rows="5" placeholder="Ejemplo: HOLA MUNDO"></textarea>
                            <div class="form-text">
                                Introduce el texto o código Morse que deseas traducir.
                            </div>
                        </div>
                        <div class="d-grid mb-4">
                            <button id="convertir" type="button" class="btn btn-success btn-lg">
                                <i class="fas fa-sync-alt me-2"></i>
                                Convertir
                            </button>
                        </div>
                        <div class="mb-3">
                            <label for="resultado" class="form-label fw-bold">
                                <i class="fas fa-clipboard-check me-2"></i>
                                Resultado de la conversión:
                            </label>
                            <textarea id="resultado" class="form-control bg-light" rows="5"
                                placeholder="Aquí aparecerá el resultado..." readonly></textarea>

                            <div id="mensaje" class="alert alert-light border mt-3" role="status">
                                Listo para convertir.
                            </div>
                        </div>
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button id="limpiar" type="button" class="btn btn-danger flex-fill">
                                <i class="fas fa-trash-alt me-2">
                                </i>Limpiar campos 
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="../dist/bundle.js"></script>
</body>
</html>
